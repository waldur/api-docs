include:
  - project: "waldur/waldur-pipelines"
    file: "/templates/utils/release-utils.yml"

variables:
  GIT_DEPTH: 0
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.uv-cache"
  # Pinned: the API changes pages are rendered from oasdiff's changelog, whose
  # checks and wording change between releases. Bump deliberately.
  OASDIFF_VERSION: "v1.34.1"

cache:
  key:
    files:
      - uv.lock
  paths:
    - .uv-cache/

stages:
  - build
  - deploy

# Runs that publish `main`: the nightly SDK build in waldur-docs triggers this
# project with an empty RELEASE_VERSION. Shared by the schema fetch and the
# deploy so the deploy can never run without the schema it needs.
.nightly-rules:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_COMMIT_TAG == "" && $RELEASE_VERSION == ""'
    - if: '$CI_PIPELINE_SOURCE == "pipeline" && $RELEASE_VERSION == ""'
    - if: '$CI_PIPELINE_SOURCE == "trigger" && $RELEASE_VERSION == ""'
    - if: '$CI_PIPELINE_SOURCE == "web" && $RELEASE_VERSION == ""'

# Regenerates the API reference under docs/ from ./waldur-openapi-schema.yaml.
# Used by the release upload and the nightly deploy, so both render the same way.
.generate_reference:
  script:
    - pip install uv

    # Clone the generator to access its config and install it
    - git clone "https://gitlab-ci-token:${GITLAB_TOKEN}@${CI_SERVER_HOST}/waldur/waldur-sdk-docs-generator.git" /tmp/generator
    - uv pip install --system /tmp/generator

    # The generator's --clean removes docs/ entirely; keep what it does not produce
    - |
      for dir in "docs/API" "docs/integrator-guide/APIs/api-changes"; do
        if [ -d "$dir" ]; then
          echo "Preserving $dir..."
          mkdir -p "/tmp/preserve/$(dirname $dir)"
          cp -r "$dir" "/tmp/preserve/$dir"
        fi
      done

    - echo "Generating API reference documentation..."
    - waldur-sdk-docs-generator waldur-openapi-schema.yaml -c /tmp/generator/input/config.yml --clean -o docs/

    - |
      for dir in "docs/API" "docs/integrator-guide/APIs/api-changes"; do
        if [ -d "/tmp/preserve/$dir" ]; then
          echo "Restoring $dir..."
          mkdir -p "$dir"
          cp -r "/tmp/preserve/$dir/." "$dir/"
        fi
      done

Fetch OpenAPI schema:
  extends: .fetch-openapi-schema
  stage: build
  rules:
    - if: '$CI_PIPELINE_SOURCE == "pipeline" && $RELEASE_VERSION =~ /^\d+\.\d+\.\d+$/'
    - if: '$CI_PIPELINE_SOURCE == "trigger" && $RELEASE_VERSION =~ /^\d+\.\d+\.\d+$/'
    - if: '$CI_PIPELINE_SOURCE == "web" && $RELEASE_VERSION =~ /^\d+\.\d+\.\d+$/'
    # Without RELEASE_VERSION the shared template fetches develop's schema
    - !reference [.nightly-rules, rules]

Test API changes renderer:
  stage: build
  image: registry.hpc.ut.ee/mirror/library/python:3.13-bookworm
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - scripts/**/*
  script:
    - python3 -m unittest discover -s scripts -p 'test_*.py' -v

Generate OpenAPI schema diff:
  stage: build
  image:
    name: registry.hpc.ut.ee/mirror/tufin/oasdiff:${OASDIFF_VERSION}
    entrypoint: [""]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "pipeline" && $RELEASE_VERSION =~ /^\d+\.\d+\.\d+$/'
    - if: '$CI_PIPELINE_SOURCE == "trigger" && $RELEASE_VERSION =~ /^\d+\.\d+\.\d+$/'
    - if: '$CI_PIPELINE_SOURCE == "web" && $RELEASE_VERSION =~ /^\d+\.\d+\.\d+$/'
  needs:
    - job: Fetch OpenAPI schema
      artifacts: true
  before_script:
    - apk update
    - apk add --no-cache git nodejs npm
    - npm install -g markdownlint-cli
  script:
    - |
      # Compare with the newest release below this one, not simply the newest
      # schema in docs/API/: a retried pipeline finds this release's own schema
      # already committed (and diffed it against itself), and a patch release
      # of an older line finds newer ones.
      CURRENT="docs/API/waldur-openapi-schema-${RELEASE_VERSION}.yaml"
      PREV_SCHEMA=""
      for schema in $( { ls docs/API/waldur-openapi-schema-*.yaml 2>/dev/null; echo "$CURRENT"; } | sort -uV ); do
        [ "$schema" = "$CURRENT" ] && break
        PREV_SCHEMA="$schema"
      done
      echo "Previous schema: ${PREV_SCHEMA:-none}"
    - |
      if [ -z "$PREV_SCHEMA" ]; then
        echo "No previous schema found. Skipping diff generation."
      else
        PREV_VERSION=$(basename "$PREV_SCHEMA" .yaml)
        PREV_VERSION=${PREV_VERSION#waldur-openapi-schema-}
        echo "$PREV_VERSION" > previous-version.txt
        # Classified changes, rendered into the API changes page by the upload job.
        # oasdiff-severity-levels.txt (no comments allowed in it) makes removals
        # breaking that oasdiff rates lower but that break Waldur clients:
        # - request-property-removed, request-parameter-removed (WARN): DRF
        #   ignores an unknown field or query parameter, so the client's value
        #   is silently dropped and a filter stops filtering;
        # - response-optional-property-removed (INFO): make_fields_optional in
        #   waldur-mastermind marks response properties optional on endpoints
        #   with the `field` parameter only because a client may ask for a
        #   subset; a removed one is gone for every client that reads it.
        /usr/bin/oasdiff changelog -f json --severity-levels oasdiff-severity-levels.txt "$PREV_SCHEMA" waldur-openapi-schema.yaml > openapi-changelog.json
        # Every difference, description edits included, for the linked full page.
        /usr/bin/oasdiff diff -f markup "$PREV_SCHEMA" waldur-openapi-schema.yaml > openapi-diff-full.md
        sed -i "1i # Full OpenAPI schema diff - ${RELEASE_VERSION}\n\nEvery difference between the ${PREV_VERSION} and ${RELEASE_VERSION} schemas. [API changes in ${RELEASE_VERSION}](../waldur-openapi-schema-${RELEASE_VERSION}-diff.md) summarises them, breaking changes first.\n" openapi-diff-full.md
        markdownlint --disable MD041 MD035 --fix openapi-diff-full.md || true
      fi
  artifacts:
    paths:
      - previous-version.txt
      - openapi-changelog.json
      - openapi-diff-full.md
      - waldur-openapi-schema.yaml
    expire_in: 1 day

Upload OpenAPI schema and schema diff to docs:
  stage: build
  image: registry.hpc.ut.ee/mirror/library/python:3.13-bookworm
  rules:
    - if: '$CI_PIPELINE_SOURCE == "pipeline" && $RELEASE_VERSION =~ /^\d+\.\d+\.\d+$/'
    - if: '$CI_PIPELINE_SOURCE == "trigger" && $RELEASE_VERSION =~ /^\d+\.\d+\.\d+$/'
    - if: '$CI_PIPELINE_SOURCE == "web" && $RELEASE_VERSION =~ /^\d+\.\d+\.\d+$/'
  needs:
    - job: Generate OpenAPI schema diff
      artifacts: true
  before_script:
    - git config --global user.name "$GITLAB_USER_NAME"
    - git config --global user.email "$GITLAB_USER_EMAIL"
    # Authenticate remote origin using the GitLab CI token
    - git remote set-url origin "https://gitlab-ci-token:${GITLAB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
  script:
    - !reference [.generate_reference, script]

    # Copy new schema and diffs
    - mkdir -p docs/API
    - cp waldur-openapi-schema.yaml docs/API/waldur-openapi-schema-${RELEASE_VERSION}.yaml
    - API_CHANGES=docs/integrator-guide/APIs/api-changes
    - mkdir -p "$API_CHANGES/full"
    - |
      if [ -s previous-version.txt ]; then
        FULL_DIFF="full/waldur-openapi-schema-${RELEASE_VERSION}-diff-full.md"
        cp openapi-diff-full.md "$API_CHANGES/$FULL_DIFF"
        python3 scripts/render_api_changes.py page \
          --changelog openapi-changelog.json \
          --version "$RELEASE_VERSION" \
          --previous "$(cat previous-version.txt)" \
          --oasdiff-version "$OASDIFF_VERSION" \
          --full-diff "$FULL_DIFF" \
          -o "$API_CHANGES/waldur-openapi-schema-${RELEASE_VERSION}-diff.md"
      else
        echo "No previous schema, so no API changes page for ${RELEASE_VERSION}"
      fi
    - python3 scripts/render_api_changes.py index --dir "$API_CHANGES"

    # Commit and push changes
    - git add docs/
    - git commit -m "Add Waldur OpenAPI schema, diff, and SDK docs for ${RELEASE_VERSION}" || exit 0
    - git pull --rebase origin main
    - git push -o ci.skip origin HEAD:main
  artifacts:
    paths:
      - docs/API/
      - docs/integrator-guide/APIs/api-changes/
    expire_in: 1 day

.deploy_base:
  stage: deploy
  image: registry.hpc.ut.ee/mirror/library/python:3.13-bookworm
  # One gh-pages writer at a time: concurrent deploys race, and the loser's
  # rejected push leaves an unpushed commit behind (see below).
  resource_group: gh-pages
  before_script:
    - git config --global user.name "$GITLAB_USER_NAME"
    - git config --global user.email "$GITLAB_USER_EMAIL"
    # Authenticate remote origin using the GitLab CI token
    - git remote set-url origin "https://gitlab-ci-token:${GITLAB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
    # Fetch all branches to ensure mike can access the gh-pages branch
    - git fetch origin
    # Runners reuse build directories, so a local gh-pages left by an earlier
    # job (e.g. one whose push was rejected) survives into this one and mike
    # refuses to deploy: "gh-pages has diverged from origin/gh-pages".
    # Reset it to the remote; HEAD is detached, so gh-pages is never checked out.
    - git fetch origin +gh-pages:gh-pages
  script:
    - pip install uv
    - uv sync --all-extras --dev

# Publishes `main` from develop's schema. The generated pages are deployed
# only, never committed: the committed docs/ stay the last release's.
Build latest pages:
  extends: .deploy_base
  rules:
    - !reference [.nightly-rules, rules]
  needs:
    - job: Fetch OpenAPI schema
      artifacts: true
  script:
    - !reference [.generate_reference, script]
    - !reference [.deploy_base, script]
    - uv run mike deploy --push main
    # `latest` is the newest release. Release runs move it; repair it here in
    # case anything else did, so it never stays on `main`.
    - uv run mike list --json > /tmp/mike-versions.json
    - |
      NEWEST_RELEASE=$(python3 - /tmp/mike-versions.json <<'EOF'
      import json, re, sys
      with open(sys.argv[1]) as f:
          versions = json.load(f)
      releases = [v for v in versions if re.fullmatch(r"\d+\.\d+\.\d+", v["version"])]
      if not releases:
          print("No X.Y.Z release is deployed, leaving latest alone", file=sys.stderr)
      else:
          newest = max(releases, key=lambda v: [int(p) for p in v["version"].split(".")])
          if "latest" in newest["aliases"]:
              print("latest is already on " + newest["version"], file=sys.stderr)
          else:
              print(newest["version"])
      EOF
      )
      if [ -n "$NEWEST_RELEASE" ]; then
        echo "Moving latest to $NEWEST_RELEASE"
        uv run mike alias --push --update-aliases "$NEWEST_RELEASE" latest
      fi
    - uv run mike set-default --push latest

Build tagged pages:
  extends: .deploy_base
  rules:
    - if: '$CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+$/'
    - if: '$CI_PIPELINE_SOURCE == "pipeline" && $RELEASE_VERSION =~ /^\d+\.\d+\.\d+$/'
    - if: '$CI_PIPELINE_SOURCE == "trigger" && $RELEASE_VERSION =~ /^\d+\.\d+\.\d+$/'
    - if: '$CI_PIPELINE_SOURCE == "web" && $RELEASE_VERSION =~ /^\d+\.\d+\.\d+$/'
  needs:
    - job: Upload OpenAPI schema and schema diff to docs
      artifacts: true
      optional: true
  script:
    - !reference [.deploy_base, script]
    - TARGET_VERSION="${CI_COMMIT_TAG:-$RELEASE_VERSION}"
    - echo "Deploying documentation version $TARGET_VERSION"
    - uv run mike deploy --push --update-aliases $TARGET_VERSION latest
    - uv run mike set-default --push latest
